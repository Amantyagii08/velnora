spring.application.name=velnora

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/rural_marketplace}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
debug=false
app.image.upload-dir=${UPLOAD_DIR:./data/uploads}
spring.web.resources.static-locations=file:${UPLOAD_DIR:./data/uploads}/
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Optional first-admin setup. Set these values locally before the first launch.
app.admin.setup.name=${ADMIN_SETUP_NAME:}
app.admin.setup.email=${ADMIN_SETUP_EMAIL:}
app.admin.setup.phone=${ADMIN_SETUP_PHONE:}
app.admin.setup.password=${ADMIN_SETUP_PASSWORD:}
